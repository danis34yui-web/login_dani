<g font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#333">
<text x="40" y="850" font-weight="700">Estructura de componentes (arriba a abajo)</text>
<text x="40" y="874">Logo (72 dp) > Titulo + subtitulo > OutlinedTextField correo > OutlinedTextField contrasena (ojo mostrar/ocultar)</text>
<text x="40" y="896">> Checkbox + TextButton olvide > Button principal (48 dp) > Divider "o" > OutlinedButton Google > TextButton registro</text>
<text x="40" y="922">Interaccion: errores bajo el campo (supportingText), boton deshabilitado + CircularProgressIndicator al cargar, Snackbar para error de credenciales.</text>
